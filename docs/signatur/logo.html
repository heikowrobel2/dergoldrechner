<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  /* Wordmark for the e-mail signature, rendered to PNG with headless Edge (site fonts, no external requests). */
  @font-face { font-family: Fraunces; src: url('../../site/assets/fonts/Fraunces-normal.woff2') format('woff2'); font-style: normal; font-weight: 300 700; }
  @font-face { font-family: Fraunces; src: url('../../site/assets/fonts/Fraunces-italic.woff2') format('woff2'); font-style: italic; font-weight: 300 700; }
  html, body { margin: 0; background: transparent; }
  .mark { display: inline-flex; align-items: baseline; gap: .26em; padding: 6px 4px 10px; font: 400 34px/1 Fraunces, Georgia, serif; letter-spacing: -.01em; color: #1f1a12; white-space: nowrap; }
  .mark em { font-style: italic; color: #a8802f; }
</style>
</head>
<body><span class="mark">Der <em>Goldrechner</em></span></body>
</html>
